
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Budget - Manage your income, expenses, budget and savings in one place.">
  <title>My Budget - Personal Finance Manager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
    }
    header {
      padding: 22px 8%;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }
    .logo { color: #2563eb; font-size: 25px; font-weight: bold; }
    main {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .content { max-width: 700px; }
    h1 { font-size: 42px; margin-bottom: 18px; }
    p { color: #6b7280; font-size: 18px; line-height: 1.8; }
    footer {
      padding: 25px;
      text-align: center;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
    }
    @media (max-width: 600px) {
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">My Budget</div>
  </header>

  <main>
    <div class="content">
      <h1>Manage Your Money Smarter</h1>
      <p>
        My Budget helps you organize your income, expenses,
        budget, savings and financial activities in one place.
      </p>
      <p>
        Simple financial management for your everyday life.
      </p>
    </div>
  </main>

  <footer>
    &copy; 2026 My Budget. All rights reserved.
  </footer>
</body>
</html>
